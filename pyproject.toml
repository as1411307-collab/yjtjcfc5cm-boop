[project]
name = "unified-ai-core"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2,<3", "cryptography>=50.0.2,<51"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pip-audit>=2.9,<3", "playwright>=1.50,<2"]
[tool.setuptools]
packages = ["core"]

[tool.setuptools.package-data]
core = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
pythonpath = ["."]
