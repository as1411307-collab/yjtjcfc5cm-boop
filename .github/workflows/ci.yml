name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m compileall -q core
      - run: python -m pytest -q
      - run: python -m pip_audit --local
      - run: python -m playwright install --with-deps chromium
      - run: RUN_BROWSER_TESTS=1 python -m pytest -q tests/test_web_browser.py
  swift-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test --package-path ios/VoiceInteractionAudit
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: xcodebuild -project ios/UnifiedAI.xcodeproj -scheme UnifiedAI -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
