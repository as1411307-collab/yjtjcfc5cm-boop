name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - name: Verify installable wheel includes web assets
        shell: bash
        run: |
          python -m pip wheel --no-deps . -w /tmp/unified-ai-wheels
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("/tmp/unified-ai-wheels").glob("unified_ai_core-*.whl"))
          assert len(wheels) == 1, f"Expected one wheel; found {wheels}"
          required = {"core/web/index.html", "core/web/app.js", "core/web/styles.css"}
          with ZipFile(wheels[0]) as archive:
              missing = required - set(archive.namelist())
          assert not missing, f"Missing packaged web assets: {sorted(missing)}"
          PY
      - run: python -m compileall -q core
      - run: python -m pytest -q
      - run: python -m pip_audit --local
      - run: python -m playwright install --with-deps chromium
      - name: Browser session smoke test
        shell: bash
        run: |
          set +e
          RUN_BROWSER_TESTS=1 python -m pytest -q tests/test_web_browser.py 2>&1 | tee /tmp/browser-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "## Browser test failed" >> "$GITHUB_STEP_SUMMARY"
            tail -n 200 /tmp/browser-test.log >> "$GITHUB_STEP_SUMMARY"
            python3 tools/annotate_log.py /tmp/browser-test.log "Browser test failed"
            exit "$status"
          fi
  swift-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test --package-path ios/VoiceInteractionAudit
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - name: Build iOS simulator
        shell: bash
        run: |
          set +e
          xcodebuild -project ios/UnifiedAI.xcodeproj -scheme UnifiedAI -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/unifiedai-xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "## iOS simulator build failed" >> "$GITHUB_STEP_SUMMARY"
            tail -n 200 /tmp/unifiedai-xcodebuild.log >> "$GITHUB_STEP_SUMMARY"
            python3 tools/annotate_log.py /tmp/unifiedai-xcodebuild.log "iOS simulator build failed"
            exit "$status"
          fi
