<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unified AI Core</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1220;color:#e9efff}
*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:24px}
h1{font-size:1.7rem}section{background:#182238;border:1px solid #35435c;border-radius:16px;padding:18px;margin:16px 0}
input,textarea,select,button{font:inherit;border-radius:9px;padding:12px}
input,textarea,select{width:100%;background:#0b1427;color:white;border:1px solid #556782}
button{background:#3677e8;color:white;border:0;cursor:pointer;margin:5px 0}
button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
#messages{min-height:150px;max-height:50vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.msg{padding:12px;border-radius:12px;margin:8px 0;background:#25334e}
.msg.user{background:#173e62}small{color:#b5c6e2}label{display:block;margin:8px 0}
</style>
</head>
<body><main>
<h1>🧙‍♂️ Unified AI Core</h1>
<p>مساعد محلي تجريبي — لا تضع مفتاح الوصول في صفحة منشورة للعامة.</p>
<section>
<label>مفتاح API<input id="key" type="password" autocomplete="off" placeholder="أدخل AI_API_KEY"></label>
<div class="row"><button id="start">إنشاء جلسة</button><button id="load">تحميل المحادثة</button></div>
<small id="session">لا توجد جلسة</small>
</section>
<section>
<label>المزوّد<select id="provider"><option value="ollama">Ollama</option><option value="langflow">Langflow</option></select></label>
<div id="messages" aria-live="polite"></div>
<label>رسالتك<textarea id="prompt" rows="3" maxlength="10000" placeholder="اكتب رسالة..."></textarea></label>
<button id="send">إرسال</button><small id="status"></small>
</section>
<section>
<h2>الموافقات</h2>
<button id="refresh">تحديث الطلبات</button><div id="approvals"></div>
<small>الموافقة تُسجل القرار فقط؛ لا تنفذ عمليات خارجية.</small>
</section>
</main>
<script>
const el=id=>document.getElementById(id);
let sessionId="";
async function api(path,options={}){
 const response=await fetch(path,{...options,headers:{"Content-Type":"application/json","X-API-Key":el("key").value,...options.headers}});
 const data=await response.json();
 if(!response.ok)throw Error(data.detail||"فشل الطلب");
 return data;
}
function showError(error){el("status").textContent=error.message}
function addMessage(role,content){
 const div=document.createElement("div");
 div.className="msg "+role;
 div.textContent=(role==="user"?"أنت: ":"المساعد: ")+content;
 el("messages").append(div);
 el("messages").scrollTop=el("messages").scrollHeight;
}
el("start").onclick=async()=>{
 try{const data=await api("/sessions",{method:"POST"});sessionId=data.session_id;el("session").textContent="الجلسة: "+sessionId;el("messages").replaceChildren();el("status").textContent=""}catch(e){showError(e)}
};
el("load").onclick=async()=>{
 if(!sessionId)return showError(Error("أنشئ جلسة أولًا"));
 try{const data=await api("/sessions/"+encodeURIComponent(sessionId)+"/messages");el("messages").replaceChildren();data.messages.forEach(m=>addMessage(m.role,m.content))}catch(e){showError(e)}
};
el("send").onclick=async()=>{
 const message=el("prompt").value.trim();
 if(!sessionId||!message)return showError(Error("أنشئ جلسة واكتب رسالة"));
 el("send").disabled=true;el("status").textContent="جاري المعالجة...";
 try{const data=await api("/chat",{method:"POST",body:JSON.stringify({session_id:sessionId,message,provider:el("provider").value})});addMessage("user",message);addMessage("assistant",data.answer);el("prompt").value="";el("status").textContent="تم"}catch(e){showError(e)}
 finally{el("send").disabled=false}
};
el("refresh").onclick=async()=>{
 try{
 const data=await api("/approvals");el("approvals").replaceChildren();
 if(!data.approvals.length){el("approvals").textContent="لا توجد طلبات";return}
 for(const item of data.approvals){
 const div=document.createElement("div");div.className="msg";div.textContent=item.action+" — "+item.status+" ";
 if(item.status==="pending")for(const [label,approve] of [["موافقة",true],["رفض",false]]){
 const button=document.createElement("button");button.textContent=label;
 button.onclick=async()=>{try{await api("/approvals/"+encodeURIComponent(item.id)+"/decision",{method:"POST",body:JSON.stringify({approve})});el("refresh").click()}catch(e){showError(e)}};
 div.append(button);
 }
 el("approvals").append(div);
 }
 }catch(e){showError(e)}
};
</script></body></html>
